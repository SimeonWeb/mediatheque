services:
  api:
    build: ./api
    command: sh -c "composer install && mkdir -p var/uploads var/cache var/log && chown -R www-data:www-data var && apache2-foreground"
    ports:
      - "80:80"
      - "8000:80"
    volumes:
      - ./api:/var/www/html
    depends_on:
      - mysql
      - front

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: mediatheque
      MYSQL_USER: mediatheque
      MYSQL_PASSWORD: mediatheque
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  front:
    image: node:24-alpine
    working_dir: /app
    command: /app/command
    ports:
      - "5173:5173"
    volumes:
      - ./front:/app

volumes:
  mysql_data:
