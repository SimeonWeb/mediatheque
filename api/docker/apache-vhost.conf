<VirtualHost *:80>
    ServerName localhost
    ServerAlias macbook-pro-de-simon.local
    DocumentRoot /var/www/html/public
    SetEnvIf Authorization "(.+)" HTTP_AUTHORIZATION=$1
    SetEnvIf Request_URI "^/(api|uploads)(/|$)" no-proxy=1

    ProxyPreserveHost On
    ProxyPass / http://front:5173/ upgrade=websocket
    ProxyPassReverse / http://front:5173/

    <Directory /var/www/html/public>
        AllowOverride None
        Options FollowSymLinks
        Require all granted
        DirectoryIndex index.php
        FallbackResource /index.php
    </Directory>

    Alias /uploads /var/www/html/var/uploads

    <Directory /var/www/html/var/uploads>
        AllowOverride None
        Options -Indexes
        Require all granted
        FallbackResource disabled
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
