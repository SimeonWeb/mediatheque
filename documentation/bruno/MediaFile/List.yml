  url: "{{host}}/media_files?page=1&itemsPerPage=50&sort[createdAt]=ASC&type=audio"
  params:
    - name: page
      value: "1"
      type: query
    - name: itemsPerPage
      value: "50"
      type: query
    - name: uploader
      value: machin
      type: query
      disabled: true
    - name: sort[createdAt]
      value: ASC
      type: query
